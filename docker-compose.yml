name: cinema-booking

services:
  auth-postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: cinema_auth
      POSTGRES_USER: cinema_auth_app
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-54321}:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema_auth_app -d cinema_auth"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [cinema-platform]

  movie-postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: cinema_movie
      POSTGRES_USER: cinema_movie_app
      POSTGRES_PASSWORD: ${MOVIE_DB_PASSWORD:?Set MOVIE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MOVIE_DB_PORT:-54322}:5432"
    volumes:
      - movie-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema_movie_app -d cinema_movie"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [cinema-platform]

  cinema-postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: cinema_cinema
      POSTGRES_USER: cinema_cinema_app
      POSTGRES_PASSWORD: ${CINEMA_DB_PASSWORD:?Set CINEMA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CINEMA_DB_PORT:-54323}:5432"
    volumes:
      - cinema-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema_cinema_app -d cinema_cinema"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [cinema-platform]

  booking-postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: cinema_booking
      POSTGRES_USER: cinema_booking_app
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${BOOKING_DB_PORT:-54324}:5432"
    volumes:
      - booking-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema_booking_app -d cinema_booking"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [cinema-platform]

  payment-postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: cinema_payment
      POSTGRES_USER: cinema_payment_app
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PAYMENT_DB_PORT:-54325}:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema_payment_app -d cinema_payment"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [cinema-platform]

  notification-postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: cinema_notification
      POSTGRES_USER: cinema_notification_app
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${NOTIFICATION_DB_PORT:-54326}:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cinema_notification_app -d cinema_notification",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [cinema-platform]

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [cinema-platform]

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVER: kafka:9092
      KAFKA_TOPIC_PARTITIONS: 3
      KAFKA_EVENT_RETENTION_MS: 604800000
      KAFKA_QUARANTINE_RETENTION_MS: 1209600000
    entrypoint: ["/bin/bash", "/opt/kafka-init/create-topics.sh"]
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/opt/kafka-init/create-topics.sh:ro
    restart: "no"
    networks: [cinema-platform]

  redis:
    image: redis:8.10.2-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [cinema-platform]

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [cinema-platform]

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [observability]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [cinema-platform]

networks:
  cinema-platform:
    name: cinema-booking-network

volumes:
  auth-postgres-data:
  movie-postgres-data:
  cinema-postgres-data:
  booking-postgres-data:
  payment-postgres-data:
  notification-postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
