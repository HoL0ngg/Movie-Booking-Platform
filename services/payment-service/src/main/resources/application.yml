server:
  port: ${PAYMENT_SERVICE_PORT:8085}
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    issuer: cinema-auth-service
spring:
  config:
    import: "optional:file:../../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:54325/cinema_payment}
    username: ${PAYMENT_DB_USER:cinema_payment_app}
    password: ${PAYMENT_DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: payment-service
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      missing-topics-fatal: false
    producer:
      acks: all
      properties:
        enable.idempotence: true

# payment:
#   providers:
#     vnpay:
#       enabled: ${PAYMENT_VNPAY_ENABLED:false}
#   vnpay:
#     tmn-code: ${VNPAY_TMN_CODE:}
#     hash-secret: ${VNPAY_HASH_SECRET:}
#     return-url: ${VNPAY_RETURN_URL:}

payment:
  # Provider dùng khi request không chỉ định; phải khớp PaymentProvider.code() của một bean đã đăng ký.
  default-provider: vnpay
  default-currency: VND
  # Địa chỉ trang kết quả của frontend; ProviderReturnController redirect khách về đây sau khi thanh toán.
  frontend-result-url: ${PAYMENT_FRONTEND_RESULT_URL:http://localhost:3000/payment/result}
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8084}
    timeout: PT5S
  vnpay:
    # Lấy từ email đăng ký sandbox: https://sandbox.vnpayment.vn/devreg/ . KHÔNG commit giá trị thật.
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    # Trình duyệt khách quay về đây (chỉ dùng để hiển thị). IPN URL cấu hình riêng trên cổng merchant VNPay:
    #   <URL public>/provider-webhooks/vnpay
    return-url: ${PAYMENT_PUBLIC_BASE_URL:http://localhost:8085}/provider-return/vnpay
    version: "2.1.0"
    order-type: other
    default-locale: vn
    payment-window: PT15M
    hold-safety-margin: PT15S
    min-hold-remaining: PT90S
    api-timeout: PT10S
    server-ip: ${PAYMENT_SERVER_IP:127.0.0.1}
    verify-api-signature: true
  reconcile:
    enabled: true
    poll-delay-ms: 30000
    min-age: PT60S
    expiry-grace: PT2M
    batch-size: 50
  refund:
    dispatch-enabled: true
    poll-delay-ms: 10000
    retry-delay: PT30S
    max-age: PT24H
    batch-size: 20
cinema:
  messaging:
    booking-topic: cinema.booking-events.v1
    payment-topic: cinema.payment-events.v1
    payment-quarantine-topic: cinema.payment-events.quarantine.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/openapi.yaml

logging:
  structured:
    format:
      console: ecs

info:
  app:
    name: ${spring.application.name}
    phase: 1
