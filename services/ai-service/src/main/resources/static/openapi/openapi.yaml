openapi: 3.1.0
info:
  title: Cinema AI Service
  version: 0.1.0
  description: >-
    Optional stateless cinema conversation using the OpenRouter OpenAI-compatible API
    and model openrouter/free. Enable with AI_CHAT_PROVIDER=openai
    and server-side OPENROUTER_API_KEY. Provider defaults to openai;
    explicitly set AI_CHAT_PROVIDER=none to disable chat.
    This prototype chat endpoint is unauthenticated. Each turn is grounded with
    read-only public data from movie-service (published movies, genres) and
    cinema-service (cinemas, published showtimes for today and tomorrow), fetched
    through their APIs and cached briefly. Seat availability, booking and payment
    operations are not supported; model output is never proof of availability or price.
servers:
  - url: http://localhost:8087
paths:
  /api/v1/ai/chat:
    post:
      operationId: chat
      summary: Cinema conversation grounded with published catalog and schedule data
      description: >-
        Available only when OpenRouter is enabled. Client supplies bounded
        history; conversation state is not persisted. Production authorization,
        request limits remain required. OpenRouter calls are bounded to 45 seconds
        with no SDK retries; the gateway AI route waits up to 60 seconds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Generated conversational response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid request
        '503':
          description: OpenRouter is overloaded or unavailable (AI_PROVIDER_UNAVAILABLE)
          content:
            application/json:
              schema:
                type: object
                required: [code, message, traceId, timestamp]
                properties:
                  code:
                    type: string
                    const: AI_PROVIDER_UNAVAILABLE
                  message:
                    type: string
                  traceId:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
components:
  schemas:
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: Must contain non-whitespace text.
        history:
          type: [array, 'null']
          maxItems: 30
          description: Omitted or null history is treated as empty.
          items:
            $ref: '#/components/schemas/ChatMessage'
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [USER, ASSISTANT]
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: Must contain non-whitespace text.
    ChatResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
