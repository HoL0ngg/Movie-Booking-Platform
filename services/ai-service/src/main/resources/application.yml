server:
  port: ${AI_SERVICE_PORT:8087}

spring:
  application:
    name: ai-service
  ai:
    chat:
      client:
        enabled: ${AI_CHAT_CLIENT_ENABLED:true}
    model:
      chat: ${AI_CHAT_PROVIDER:none}
      embedding: none
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${AI_GEMINI_MODEL:gemini-2.5-flash}
            temperature: ${AI_GEMINI_TEMPERATURE:0.7}
    ollama:
      base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${AI_OLLAMA_MODEL:llama3.2}
        num-predict: 512

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/openapi.yaml

logging:
  structured:
    format:
      console: ecs

info:
  app:
    name: ${spring.application.name}
    stage: conversation
