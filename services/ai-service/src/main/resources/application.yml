server:
  port: ${AI_SERVICE_PORT:8087}

spring:
  config:
    import: 'optional:file:../../.env[.properties],optional:file:./.env[.properties]'
  application:
    name: ai-service
  ai:
    chat:
      client:
        enabled: ${AI_CHAT_CLIENT_ENABLED:true}
    model:
      chat: ${AI_CHAT_PROVIDER:openai}
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
    openai:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:${API_KEY:}}
      timeout: 45s
      max-retries: 0
      chat:
        options:
          model: ${OPENROUTER_MODEL:openrouter/free}
    retry:
      max-attempts: 1

ai:
  catalog:
    # Read-only grounding from owner APIs (never their databases). Called directly, not through the gateway.
    movie-service-url: ${MOVIE_SERVICE_URL:http://localhost:8082}
    cinema-service-url: ${CINEMA_SERVICE_URL:http://localhost:8083}
    timezone: ${AI_CATALOG_TIMEZONE:Asia/Ho_Chi_Minh}
    connect-timeout: 2s
    read-timeout: 3s
    cache-ttl: ${AI_CATALOG_CACHE_TTL:60s}
    failure-cache-ttl: 15s
    schedule-days: 2
    max-movies: 40
    max-showtimes: 80

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/openapi.yaml

logging:
  structured:
    format:
      console: ecs

info:
  app:
    name: ${spring.application.name}
    stage: catalog-grounded-conversation
