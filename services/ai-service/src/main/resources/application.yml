server:
  port: ${AI_SERVICE_PORT:8087}

spring:
  config:
    import: 'optional:file:../../.env[.properties],optional:file:./.env[.properties]'
  application:
    name: ai-service
  ai:
    chat:
      client:
        enabled: ${AI_CHAT_CLIENT_ENABLED:true}
    model:
      chat: ${AI_CHAT_PROVIDER:google-genai}
      embedding: none
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: gemini-3.8-flash

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/openapi.yaml

logging:
  structured:
    format:
      console: ecs

info:
  app:
    name: ${spring.application.name}
    stage: conversation
