server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2500
      mail.smtp.writetimeout: 2500
  config:
    import: "optional:file:../../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:54321/cinema_auth}
    username: ${AUTH_DB_USER:cinema_auth_app}
    password: ${AUTH_DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/openapi.yaml

logging:
  structured:
    format:
      console: ecs

info:
  app:
    name: ${spring.application.name}
    phase: 1

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    issuer: cinema-auth-service
    access-ttl: 15m
    refresh-ttl: 7d
  internal:
    token: ${INTERNAL_API_TOKEN:}
  otp:
    ttl: 5m
    resend-cooldown: 60s
    max-attempts: 5
    mail-wait: 3500ms
    mail-enabled: ${OTP_MAIL_ENABLED:true} # false = chỉ in OTP ra log (dev)
    mail-from: ${MAIL_USERNAME:no-reply@cinemat.local}
