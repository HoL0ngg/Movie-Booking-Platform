server:
  port: ${MOVIE_SERVICE_PORT:8082}

spring:
  application:
    name: movie-service
  datasource:
    url: ${MOVIE_DB_URL:jdbc:postgresql://localhost:54322/cinema_movie}
    username: ${MOVIE_DB_USER:cinema_movie_app}
    password: ${MOVIE_DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-migration-naming: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/openapi.yaml

logging:
  structured:
    format:
      console: ecs

info:
  app:
    name: ${spring.application.name}
    phase: 1
