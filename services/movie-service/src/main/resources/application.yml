server:
  port: ${MOVIE_SERVICE_PORT:8082}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    issuer: cinema-auth-service

spring:
  config:
    import: 'optional:file:../../.env[.properties],optional:file:./.env[.properties]'
  application:
    name: movie-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase (remote, max_connections 60 shared by all services): keep a small warm pool,
      # ping idle connections so the pooler/NAT does not drop them, and never hang on a dead socket.
      maximum-pool-size: 3
      minimum-idle: 3
      connection-timeout: 5000
      keepalive-time: 30000
      max-lifetime: 600000
      data-source-properties:
        tcpKeepAlive: true
        socketTimeout: 30
        connectTimeout: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/openapi.yaml

logging:
  structured:
    format:
      console: ecs

info:
  app:
    name: ${spring.application.name}
    phase: 1
