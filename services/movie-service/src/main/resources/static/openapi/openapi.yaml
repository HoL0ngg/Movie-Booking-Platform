openapi: 3.1.0
info:
  title: Cinema Movie Service API
  version: 0.1.0
  description: Public read-only published movie catalog. Search and pagination are not yet implemented.
servers:
  - url: /api/v1
paths:
  /movies:
    get:
      operationId: listMovies
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [NOW_SHOWING, COMING_SOON]}}
      responses:
        "200":
          description: Published movie catalog filtered by derived release status
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Movie"}}
        "400": {$ref: "#/components/responses/Error"}
  /movies/{movieId}:
    get:
      operationId: getMovie
      parameters:
        - {name: movieId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Published movie detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Movie"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
components:
  responses:
    Error:
      description: Standard error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Movie:
      type: object
      required: [id, title, synopsis, durationMinutes, releaseDate, status]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        synopsis: {type: [string, "null"]}
        durationMinutes: {type: integer, minimum: 1}
        releaseDate: {type: [string, "null"], format: date}
        status: {type: string, enum: [NOW_SHOWING, COMING_SOON]}
    Error:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: {type: string}
        message: {type: string}
        traceId: {type: string}
        timestamp: {type: string, format: date-time}
        details: {type: object, additionalProperties: true}
