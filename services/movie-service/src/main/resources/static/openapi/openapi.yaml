openapi: 3.1.0
info:
  title: Cinema Movie Service API
  version: 0.1.0
    description: Public read-only published movie catalog with title search and genre filter. Pagination is not yet implemented.
servers:
  - url: /api/v1
paths:
  /movies:
    get:
      operationId: listMovies
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [NOW_SHOWING, COMING_SOON]}}
        - {name: query, in: query, schema: {type: string, maxLength: 200}, description: Case-insensitive title substring}
        - {name: genre, in: query, schema: {type: string, maxLength: 100}, description: Exact genre name, case-insensitive}
      responses:
        "200":
          description: Published movie catalog filtered by derived release status
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Movie"}}
        "400": {$ref: "#/components/responses/Error"}
  /movies/{movieId}:
    get:
      operationId: getMovie
      parameters:
        - {name: movieId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Published movie detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Movie"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
components:
  responses:
    Error:
      description: Standard error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Movie:
      type: object
      required: [id, title, synopsis, posterUrl, durationMinutes, releaseDate, status, genres]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        synopsis: {type: [string, "null"]}
        posterUrl: {type: [string, "null"], format: uri, description: Public movie poster URL; null when unavailable}
        durationMinutes: {type: integer, minimum: 1}
        releaseDate: {type: [string, "null"], format: date}
        status: {type: string, enum: [NOW_SHOWING, COMING_SOON]}
        genres: {type: array, items: {type: string}, description: Genre names; empty when none assigned}
    Error:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: {type: string}
        message: {type: string}
        traceId: {type: string}
        timestamp: {type: string, format: date-time}
        details: {type: object, additionalProperties: true}
