openapi: 3.1.0
info:
  title: Cinema Movie Service API
  version: 0.1.0
  description: Phase 1 contract only; operations are not implemented yet.
servers:
  - url: /api/v1
paths:
  /movies:
    get:
      operationId: listMovies
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: query, in: query, schema: {type: string}}
      responses:
        "200": {description: Cursor-paginated movie catalog}
  /movies/{movieId}:
    get:
      operationId: getMovie
      parameters:
        - {name: movieId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Movie detail}
        "404": {$ref: "#/components/responses/Error"}
components:
  responses:
    Error:
      description: Standard error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: {type: string}
        message: {type: string}
        traceId: {type: string}
        timestamp: {type: string, format: date-time}
        details: {type: object, additionalProperties: true}
