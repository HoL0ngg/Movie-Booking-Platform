server:
  port: ${CINEMA_SERVICE_PORT:8083}

spring:
  application:
    name: cinema-service
  datasource:
    url: ${CINEMA_DB_URL:jdbc:postgresql://localhost:54323/cinema_cinema}
    username: ${CINEMA_DB_USER:cinema_cinema_app}
    password: ${CINEMA_DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: cinema-service
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      missing-topics-fatal: false
    producer:
      acks: all
      properties:
        enable.idempotence: true

cinema:
  messaging:
    showtime-topic: cinema.showtime-events.v1
    quarantine-topic: cinema.showtime-events.quarantine.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/openapi.yaml

logging:
  structured:
    format:
      console: ecs

info:
  app:
    name: ${spring.application.name}
    phase: 1
