server:
  port: ${BOOKING_SERVICE_PORT:8084}

spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:54324/cinema_booking}
    username: ${BOOKING_DB_USER:cinema_booking_app}
    password: ${BOOKING_DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: booking-service
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      missing-topics-fatal: false
    producer:
      acks: all
      properties:
        enable.idempotence: true

cinema:
  messaging:
    showtime-topic: cinema.showtime-events.v1
    booking-topic: cinema.booking-events.v1
    payment-topic: cinema.payment-events.v1
    booking-quarantine-topic: cinema.booking-events.quarantine.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/openapi.yaml

logging:
  structured:
    format:
      console: ecs

info:
  app:
    name: ${spring.application.name}
    phase: 1
