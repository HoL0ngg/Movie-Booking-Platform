server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/ai/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/me
            - id: movie-service
              uri: ${MOVIE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/movies/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/reservations/**,/api/v1/bookings/**,/api/v1/showtimes/*/seats
            - id: cinema-service
              uri: ${CINEMA_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/cinemas/**,/api/v1/showtimes/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/payments/**
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/openapi.yaml

logging:
  structured:
    format:
      console: ecs

info:
  app:
    name: ${spring.application.name}
    phase: 1
