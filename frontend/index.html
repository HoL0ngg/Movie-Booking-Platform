<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <script>
      try {
        const theme = localStorage.getItem('cinemat-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#161922' : '#f7f8fc';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <meta name="description" content="Cinema booking prototype" />
    <title>Cinémat — Movie Booking</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
